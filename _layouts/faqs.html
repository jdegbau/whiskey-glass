---
layout: default
---
<section class="section">
  <div class="container is-max-desktop">
    
    <nav class="breadcrumb has-bullet-separator mb-5">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/faqs/">FAQ</a></li>
        <li class="is-active"><a href="#">{{ page.category }}</a></li>
      </ul>
    </nav>

    <div class="content-wrapper">
      <h1 class="title is-1 mb-6">{{ page.question }}</h1>

      <div class="notification is-light" style="border-left: 5px solid #d4af37; background-color: #fff9e6;">
        <h4 class="subtitle is-6 is-uppercase has-text-weight-bold mb-2" style="letter-spacing: 1px; color: #8a6d1c;">
          The Short Answer
        </h4>
        <p class="is-size-4 has-text-weight-medium" style="line-height: 1.4;">
          {{ page.quick_answer }}
        </p>
      </div>

      <div class="content is-medium mt-6">
        <h3 class="title is-4">Deep Dive</h3>
        {{ content }}
      </div>
    </div>

    <hr class="mt-6">
    <div class="level">
      <div class="level-left">
        <a href="/faq/" class="button is-text">← Back to all questions</a>
      </div>
      <div class="level-right">
        <span class="tag is-dark">{{ page.category }}</span>
      </div>
    </div>
  </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": {
    "@type": "Question",
    "name": "{{ page.question }}",
    "acceptedAnswer": {
      "@type": "Answer",
      "text": "{{ page.short_answer | escape }}"
    }
  }
}
</script>
