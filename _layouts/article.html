---
layout: default
---
<section class="hero is-medium is-dark" style="background: url('{{ page.image }}') center/cover no-repeat;">
  <div class="hero-body" style="background: rgba(0,0,0,0.5);">
    <div class="container has-text-centered">
      <p class="subtitle is-6 is-uppercase has-text-gold mb-2">{{ page.category }}</p>
      <h1 class="title is-1">{{ page.title }}</h1>
      <p class="is-size-6">By {{ page.author }} | {{ page.date | date: "%B %d, %Y" }}</p>
    </div>
  </div>
</section>
<section class="section">
  <div class="container is-max-medium">
    <div class="content is-medium">
      <h1 class="title is-1">{{ page.title }}</h1>
      <p class="has-text-grey">Published on {{ page.date | date: "%B %d, %Y" }}</p>
      <hr>
      <div class="article-body">
        {{ content }}
      </div>
    </div>
  </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": "{{ page.title }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "author": [{
      "@type": "Person",
      "name": "Whiskey.Glass Team"
    }]
}
</script>
