---
layout: default
---
<section class="section">
  <div class="container">
    <div class="columns is-variable is-8">
      <div class="column is-5">
        <figure class="image is-square">
          <img src="{{ page.image }}" class="is-rounded" style="border: 4px solid #d4af37;">
        </figure>
      </div>
      <div class="column is-7">
        <h1 class="title is-2">{{ page.title }}</h1>
        <div class="tags">
          <span class="tag is-warning is-light">{{ page.base_spirit }}</span>
          <span class="tag is-white">{{ page.difficulty }}</span>
          <span class="tag is-white">{{ page.prep_time }}</span>
        </div>
        <article class="message is-dark">
          <div class="message-header"><p>Ingredients</p></div>
          <div class="message-body">
            <ul class="is-ul">
              {% for item in page.ingredients %}
                <li>{{ item }}</li>
              {% endfor %}
            </ul>
          </div>
        </article>
        <div class="content">{{ content }}</div>
      </div>
    </div>
  </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Recipe",
  "name": "{{ page.title }}",
  "image": "{{ site.url }}{{ page.image }}",
  "description": "{{ content | strip_html | truncatewords: 20 }}",
  "recipeCategory": "Cocktail",
  "recipeIngredient": {{ page.ingredients | jsonify }},
  "recipeInstructions": [{
    "@type": "HowToStep",
    "text": "{{ content | strip_html | escape }}"
  }]
}
</script>
