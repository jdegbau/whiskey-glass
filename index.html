---
layout: default
title: Home
---
<section class="hero is-dark is-medium" style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1508253530041-37d45749f91a?auto=format&fit=crop&w=1600&q=80'); background-size: cover;">
  <div class="hero-body">
    <div class="container has-text-centered">
      <h1 class="title is-1">Whiskey.Glass</h1>
      <p class="subtitle">Exploring the art of the dram.</p>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="columns is-multiline">
      {% for review in site.reviews %}
      <div class="column is-4">
        <div class="card">
          <div class="card-image">
            <figure class="image is-4by3">
              <a href="{{ review.url }}"><img src="{{ review.image }}" alt="{{ review.title }}"></a>
            </figure>
          </div>
          <div class="card-content">
            <p class="heading has-text-gold">{{ review.region }}</p>
            <p class="title is-4"><a href="{{ review.url }}" class="has-text-dark">{{ review.title }}</a></p>
            <div class="content is-size-6">
              {{ review.content | strip_html | truncatewords: 20 }}
            </div>
          </div>
          <footer class="card-footer">
            <span class="card-footer-item">{{ review.rating }} ⭐</span>
            <span class="card-footer-item">{{ review.abv }}</span>
          </footer>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
